<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Головна панель платформи ARBIFY PULSE."
    />
    <meta name="theme-color" content="#020307" />
    <title>ARBIFY PULSE — Головна</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/mythic-thunder.webp" as="image" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <section class="pulse-app" aria-label="Головна ARBIFY PULSE">
        <div class="app-noise"></div>

        <header class="topbar">
          <div class="mini-brand">
            <span class="brand-mark">
              <svg
                class="crown"
                aria-hidden="true"
                viewBox="0 0 64 48"
                fill="none"
              >
                <path
                  d="M9 36 5 13l16 10L32 5l11 18 16-10-4 23H9Z"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M12 42h40M14 36h36"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                ></path>
                <circle cx="5" cy="11" r="2.5" fill="currentColor"></circle>
                <circle cx="32" cy="3" r="2.5" fill="currentColor"></circle>
                <circle cx="59" cy="11" r="2.5" fill="currentColor"></circle>
              </svg>
            </span>

            <div>
              <p class="brand-name">ARBIFY</p>
              <p class="brand-pulse">— PULSE —</p>
            </div>
          </div>

          <button
            class="icon-button notification-button"
            id="notificationButton"
            type="button"
            aria-label="Сповіщення"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M6.2 10.2c0-3.6 2.1-6.2 5.8-6.2s5.8 2.6 5.8 6.2v4l1.7 2.4h-15l1.7-2.4v-4Z"
              ></path>
              <path d="M9.8 19.2c.5.6 1.2.8 2.2.8s1.7-.2 2.2-.8"></path>
            </svg>
            <span class="notification-dot"></span>
          </button>
        </header>

        <div class="content">
          <section class="access-card">
            <div class="access-card-top">
              <div>
                <p class="micro-label">СТАТУС ДОСТУПУ</p>
                <p class="access-status">
                  <span class="live-dot"></span>
                  АКТИВНИЙ
                </p>
              </div>

              <div class="key-badge">
                <span>КЛЮЧ</span>
                <strong>K7••••</strong>
              </div>
            </div>

            <div class="access-divider"></div>

            <div class="system-row">
              <span class="system-orb"><span></span></span>
              <p>
                <strong>Pulse Core онлайн</strong>
                <span>Система готова до аналізу</span>
              </p>
              <span class="online-pill">ONLINE</span>
            </div>
          </section>

          <section class="slots-section">
            <div class="section-title-row">
              <div>
                <p class="eyebrow">ОБЕРИ ГРУ</p>
                <h1>Популярні слоти</h1>
              </div>

              <button class="text-link" id="allSlotsButton" type="button">
                Усі
                <svg
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m9 5 7 7-7 7"></path>
                </svg>
              </button>
            </div>

            <div class="slot-grid">
              <button
                class="slot-card is-selected"
                data-slot="Thunder Crown"
                type="button"
                style="--slot-accent: #8d4cff"
              >
                <span class="slot-image-wrap">
                  <img src="assets/mythic-thunder.webp" alt="" />
                  <span class="slot-shine"></span>
                  <span class="selected-check">✓</span>
                </span>
                <span class="slot-name">Thunder Crown</span>
              </button>

              <button
                class="slot-card"
                data-slot="Candy Spiral"
                type="button"
                style="--slot-accent: #ff4ecb"
              >
                <span class="slot-image-wrap">
                  <img src="assets/candy-spiral.webp" alt="" />
                  <span class="slot-shine"></span>
                  <span class="selected-check">✓</span>
                </span>
                <span class="slot-name">Candy Spiral</span>
              </button>

              <button
                class="slot-card"
                data-slot="Gem Rocket"
                type="button"
                style="--slot-accent: #21d4ff"
              >
                <span class="slot-image-wrap">
                  <img src="assets/gem-rocket.webp" alt="" />
                  <span class="slot-shine"></span>
                  <span class="selected-check">✓</span>
                </span>
                <span class="slot-name">Gem Rocket</span>
              </button>
            </div>
          </section>

          <section class="signal-card" id="signalCard">
            <div class="signal-card-glow"></div>

            <div class="radar" aria-hidden="true">
              <span class="radar-circle radar-circle-one"></span>
              <span class="radar-circle radar-circle-two"></span>
              <span class="radar-circle radar-circle-three"></span>
              <span class="radar-cross radar-cross-x"></span>
              <span class="radar-cross radar-cross-y"></span>
              <span class="radar-sweep"></span>
              <span class="radar-core"><span></span></span>
            </div>

            <div class="signal-copy">
              <p class="signal-kicker">
                <span></span>
                PULSE ANALYSIS
              </p>
              <h2 id="signalTitle">НОВИЙ СИГНАЛ</h2>
              <p id="signalDescription">
                Запусти аналіз для вибраного слота
              </p>
            </div>

            <button class="signal-button" id="signalButton" type="button">
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m13.5 2-6 11h5l-2 9 7-12h-5l1-8Z"></path>
              </svg>
              <span id="signalButtonText">ЗАПУСТИТИ</span>
            </button>
          </section>

          <div class="responsible-line">
            <span>18+</span>
            <p>Грай відповідально. Результат гри залежить від випадковості.</p>
          </div>
        </div>

        <nav class="bottom-nav" aria-label="Головне меню">
          <button class="nav-item is-active" type="button" data-section="Головна">
            <span class="nav-icon">
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m3.5 10.4 8.5-7 8.5 7"></path>
                <path d="M5.8 9.2v10.2h12.4V9.2M9.5 19.4v-6.2h5v6.2"></path>
              </svg>
            </span>
            <span>Головна</span>
          </button>

          <button class="nav-item" type="button" data-section="Сигнали">
            <span class="nav-icon">
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 4v16"></path>
                <path d="M7.8 7.4a6 6 0 0 0 0 9.2M16.2 7.4a6 6 0 0 1 0 9.2"></path>
                <path
                  d="M4.7 4.3a10.2 10.2 0 0 0 0 15.4M19.3 4.3a10.2 10.2 0 0 1 0 15.4"
                ></path>
              </svg>
            </span>
            <span>Сигнали</span>
          </button>

          <button class="nav-item" type="button" data-section="Бонуси">
            <span class="nav-icon">
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 10.2h16v10H4zM3 6.8h18v3.4H3zM12 6.8v13.4"></path>
                <path
                  d="M11.7 6.7C9.8 6.9 7 6.5 7 4.5 7 2.2 11 3 11.7 6.7ZM12.3 6.7c1.9.2 4.7-.2 4.7-2.2 0-2.3-4-1.5-4.7 2.2Z"
                ></path>
              </svg>
            </span>
            <span>Бонуси</span>
          </button>

          <button class="nav-item" type="button" data-section="Профіль">
            <span class="nav-icon">
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4.8 20c.7-4 3.1-6 7.2-6s6.5 2 7.2 6"></path>
              </svg>
            </span>
            <span>Профіль</span>
          </button>
        </nav>

        <div class="toast" id="toast" role="status" aria-live="polite">
          <span class="toast-dot"></span>
          <span id="toastText"></span>
        </div>
      </section>
    </main>

    <script src="home.js"></script>
  </body>
</html>
