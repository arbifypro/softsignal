<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03040a">
  <title>ARBIFY PULSE</title>
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
</head>
<body>
  <div class="background-layer"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="miniapp">
    <section class="login-panel">
      <img class="logo" src="./assets/logo.svg" alt="ARBIFY PULSE">
      <div class="slot-wrap">
        <div class="slot-glow"></div>
        <img class="slot" src="./assets/slot-777.webp" alt="Слот 777">
        <div class="slot-sweep"></div>
      </div>

      <div class="intro">
        <h1>Доступ лише для учасників</h1>
        <p>Введіть свій ключ для продовження</p>
      </div>

      <form id="accessForm" novalidate>
        <label class="key-field">
          <input id="accessKey" type="text" placeholder="Введіть ключ" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <span class="key-icon">⚿</span>
        </label>

        <button class="login-button" type="submit">
          <span>УВІЙТИ</span>
          <i></i>
        </button>

        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>

      <button id="helpButton" class="help-button" type="button">
        <span>◉</span> Потрібна допомога?
      </button>
    </section>
  </main>

  <section id="verifyOverlay" class="overlay" aria-hidden="true">
    <div class="verify-card">
      <div class="verify-icon">⚿</div>
      <h2 id="verifyTitle">Перевірка ключа</h2>
      <p id="verifySubtitle">Зачекайте, будь ласка</p>
      <div class="progress-track"><div id="progressBar"></div></div>
      <strong id="progressValue">0%</strong>
    </div>
  </section>

  <section id="successOverlay" class="overlay" aria-hidden="true">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <h2>Доступ підтверджено</h2>
      <p>Перша сторінка Telegram Mini App працює.</p>
      <button id="returnButton" type="button">ПОВЕРНУТИСЯ</button>
    </div>
  </section>

  <script src="./app.js"></script>
</body>
</html>
