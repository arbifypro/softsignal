<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arbify Pulse - Signals</title>
    <link rel="stylesheet" href="style.css">
    <!-- Підключаємо красивий сучасний шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- ЕКРАН ВХОДУ (LOGIN) -->
        <main class="login-screen">
            
            <!-- Логотип та Заголовок -->
            <div class="brand-header">
                <div class="crown-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 4L5 18H19L22 4L15 10L12 2L9 10L2 4Z" fill="url(#gold-grad)" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="gold-grad" x1="2" y1="2" x2="22" y2="18" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFE259"/>
                                <stop offset="100%" stop-color="#FFA751"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="brand-title">ARBIFY</h1>
                <div class="brand-subtitle">PULSE</div>
                <div class="brand-tagline">СИГНАЛИ КАЗИНО</div>
            </div>

            <!-- Слот-машина "777" -->
            <div class="slot-display">
                <div class="glow-effect"></div>
                <div class="slot-frame">
                    <div class="slot-reel"><span>7</span></div>
                    <div class="slot-reel"><span>7</span></div>
                    <div class="slot-reel"><span>7</span></div>
                </div>
            </div>

            <!-- Форма входу -->
            <div class="login-form">
                <p class="access-title">Доступ лише для членів клубу</p>
                <p class="access-subtitle">Введіть ваш ключ для продовження</p>

                <div class="input-wrapper">
                    <span class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="7.5" cy="15.5" r="5.5"></circle>
                            <path d="m21 2-9.6 9.6"></path>
                            <path d="m15.5 7.5 3 3"></path>
                        </svg>
                    </span>
                    <input type="text" id="access-key" placeholder="Введіть ключ..." autocomplete="off">
                </div>

                <button id="login-btn" class="btn-primary">
                    <span>УВІЙТИ</span>
                </button>

                <a href="#" class="help-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    Потрібна допомога?
                </a>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
